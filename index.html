<!DOCTYPE html>
<html lang="en" manifest="offline.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>شـركة أورجينال أسيـوط -ش الجمهوريـة -بجوار فرع فودافون | PS5 Relapse</title>
<style>
    :root {
        --bg-overlay: rgba(13, 14, 16, 0.45);
        --panel-bg: rgba(25, 28, 32, 0.75);
        --border-glass: rgba(255, 255, 255, 0.12);
        --accent: #a78bfa;
        --accent-glow: rgba(167, 139, 250, 0.4);
        --text-main: #ffffff;
        --text-sub: #cbd5e1;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Consolas, "DejaVu Sans Mono", monospace;
    }

    body {
        background-image: 
            linear-gradient(var(--bg-overlay), var(--bg-overlay)),
            url("icon0.png");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        color: var(--text-main);
        min-height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        padding: 28px 18px;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: inherit;
        filter: blur(2px);
        z-index: -1;
    }

    .shell {
        width: 100%;
        max-width: 720px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 1;
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel-bg);
        border: 1px solid var(--border-glass);
        padding: 15px 25px;
        border-radius: 14px;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .brand-name {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #ffffff;
        text-align: center;
    }

    .wrap {
        background: var(--panel-bg);
        border: 1px solid var(--border-glass);
        border-radius: 16px;
        padding: 30px;
        backdrop-filter: blur(12px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .hero {
        text-align: center;
    }

    #cat {
        display: block;
        width: 140px;
        height: 140px;
        max-width: 32vw;
        max-height: 32vw;
        margin: 0 auto 12px;
        border: 3px solid var(--border-glass);
        border-radius: 18px;
        object-fit: cover;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    .hero-title {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 4px;
        color: #ffffff;
    }

    .accent {
        color: var(--accent);
        text-shadow: 0 0 15px var(--accent-glow);
    }

    .hero-sub {
        font-size: 0.95rem;
        color: var(--text-sub);
    }

    #cache-status {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 7px 12px;
        padding: 12px 16px;
        border: 1px solid var(--border-glass);
        border-radius: 10px;
        background: rgba(15, 17, 20, 0.65);
        color: var(--text-sub);
        font-size: 13px;
        text-align: left;
    }
    #cache-status[data-state="success"] { border-color: rgba(73, 121, 95, 0.6); color: #a5d6b2; }
    #cache-status[data-state="error"] { border-color: rgba(139, 75, 80, 0.6); color: #f0a3a3; }
    
    #cache-progress {
        grid-column: 1 / -1;
        width: 100%;
        height: 8px;
        border: 0;
        border-radius: 4px;
        background: #1d2a32;
        accent-color: var(--accent);
    }
    #cache-progress::-webkit-progress-bar { border-radius: 4px; background: #1d2a32; }
    #cache-progress::-webkit-progress-value { border-radius: 4px; background: var(--accent); }
    #cache-status[data-state="error"] #cache-progress::-webkit-progress-value { background: #dd7777; }

    #console {
        width: 100%;
        min-height: 140px;
        max-height: min(45vh, 350px);
        overflow: auto;
        padding: 14px 16px;
        border: 1px solid var(--border-glass);
        border-radius: 10px;
        background: rgba(15, 17, 20, 0.85);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.04);
        color: var(--text-sub);
        text-align: left;
        font-size: 13px;
        overflow-wrap: anywhere;
    }
    #console > div { padding: 3px 0; }

    .foot {
        text-align: center;
        font-size: 0.85rem;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        padding-top: 5px;
    }

    @media (max-width: 480px) {
        body { padding: 14px 10px; }
        #cat { width: 100px; height: 100px; }
        .wrap { padding: 20px 15px; }
    }
</style>
</head>
<body>
<div class="shell">
    <header class="topbar">
        <span class="brand-name">شـركة أورجينال أسيـوط -ش الجمهوريـة -بجوار فرع فودافون</span>
    </header>

    <main class="wrap">
        <section class="hero">
            <img id="cat" src="./mmhmm-cats-ps5.gif" alt="Cat">
            <h1 class="hero-title">Original Office <span class="accent">PS5 1.1</span></h1>
            <p class="hero-sub">Firmware Exploit & Cache Utility</p>
        </section>

        <div id="cache-status" data-state="checking" role="status" aria-live="polite">
            <span id="cache-label">Checking cache...</span>
            <span id="cache-count">Waiting</span>
            <progress id="cache-progress" max="1" value="0" aria-label="Cache download progress"></progress>
        </div>

        <div id="console" role="log" aria-live="polite"></div>
    </main>

    <footer class="foot">
        <p>© Developer By Ahmed Abdelsalam</p>
    </footer>
</div>

<script>
    (() => {
        const status = document.getElementById("cache-status");
        const label = document.getElementById("cache-label");
        const count = document.getElementById("cache-count");
        const progress = document.getElementById("cache-progress");
        const cache = window.applicationCache;

        function showState(text, state) {
            label.textContent = text;
            status.dataset.state = state;
        }

        if (!cache) {
            showState("Offline cache is not supported", "error");
        } else {
            cache.addEventListener("checking", () => showState("Checking cache...", "checking"));
            cache.addEventListener("downloading", () => {
                count.textContent = "0 / ? resources";
                progress.value = 0;
                showState("Downloading cache...", "downloading");
            });
            cache.addEventListener("progress", (event) => {
                const total = event.total || 0;
                count.textContent = `${event.loaded} / ${total || "?"} resources`;
                if (total) progress.value = event.loaded / total;
                showState("Downloading cache...", "downloading");
            });
            cache.addEventListener("cached", () => {
                progress.value = 1;
                showState("Cache downloaded successfully", "success");
                if (count.textContent === "Waiting") count.textContent = "Ready";
            });
            cache.addEventListener("noupdate", () => {
                progress.value = 1;
                count.textContent = "Up to date";
                showState("Cache is ready", "success");
            });
            cache.addEventListener("updateready", () => {
                progress.value = 1;
                showState("Cache update downloaded successfully", "success");
            });
            cache.addEventListener("error", () => showState("Cache download failed", "error"));
            cache.addEventListener("obsolete", () => showState("Cache manifest is unavailable", "error"));

            if (cache.status === cache.IDLE) {
                progress.value = 1;
                count.textContent = "Ready";
                showState("Cache is ready", "success");
            } else if (cache.status === cache.UPDATEREADY) {
                progress.value = 1;
                showState("Cache update downloaded successfully", "success");
            } else if (cache.status === cache.OBSOLETE) {
                showState("Cache manifest is unavailable", "error");
            } else if (cache.status === cache.DOWNLOADING) {
                showState("Downloading cache...", "downloading");
            }
        }
    })();
</script>
<script src="./src/firmware.js"></script>
<script src="./src/main.js"></script>
<script src="./src/rop.js"></script>
<script src="./src/utils/syscalls.js"></script>
<script type="module" src="./src/site.js"></script>
</body>
</html>
